<svg width="100%" viewBox="0 0 621 158" role="img" xmlns="http://www.w3.org/2000/svg" style=""><defs><mask id="imagine-text-gaps-mnd6gy" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="621" height="158" fill="white"/><rect x="12" y="19" width="82.65625" height="75" fill="black" rx="2"/><rect x="364" y="19" width="182.2294921875" height="75" fill="black" rx="2"/><rect x="194.8125" y="106" width="220.375" height="29" fill="black" rx="2"/></mask></defs>
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">AI Stock Prediction Logo</title>
